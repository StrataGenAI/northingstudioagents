<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="The Northing Studio mark">
  <!-- The four-direction compass — Northing Studio brand device.
       Our own drawing on a 24 px grid: a circle, four points, one brass
       "you are here" marker on N. Never the four-circle ikigai Venn.
       N Direction · E Energy · S Systems · W Wellbeing.
       Strokes 1.4 at this viewBox scale (1.25 pt on the printed page), no fills
       except the single brass marker, which never carries meaning on its own.
       Colours are the brand tokens; this standalone copy hard-codes them so the
       file opens correctly outside the page system. -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#3E6B89" stroke-width="1.4"/>
  <circle cx="60" cy="60" r="34" fill="none" stroke="#E4DCD0" stroke-width="1"/>
  <path d="M60 8 L60 20 M60 100 L60 112 M8 60 L20 60 M100 60 L112 60"
        stroke="#3E6B89" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M60 26 L74 60 L60 94 L46 60 Z" fill="none"
        stroke="#3E6B89" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="60" cy="26" r="4" fill="#D9A441"/>
</svg>
